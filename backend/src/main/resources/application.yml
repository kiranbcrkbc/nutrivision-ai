server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: nutrivision-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  ai-service:
    url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000/api/ai}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:15000}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads/assessments}
    temp-dir: ${APP_STORAGE_TEMP_DIR:./uploads/temporary}
