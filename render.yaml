# ==============================================================================
# NutriVision AI - Render Deployment Blueprint (render.yaml)
# Deploys: React Frontend (Static Site), Spring Boot API (Docker/Web Service),
# and FastAPI AI Engine (Docker/Web Service).
# ==============================================================================

services:
  # 1. AI Microservice (FastAPI + OpenCV + MobileNetV2 ONNX)
  - type: web
    name: nutrivision-ai-service
    env: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /api/ai/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0

  # 2. Backend Gateway (Spring Boot 3 + Security + JWT)
  - type: web
    name: nutrivision-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: AI_SERVICE_BASE_URL
        fromService:
          type: web
          name: nutrivision-ai-service
          property: host
      - key: SPRING_DATASOURCE_URL
        sync: false # Set to your MySQL JDBC URL (e.g. from Aiven Free MySQL / Railway / TiDB)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://nutrivision-ai-frontend.onrender.com,http://localhost:5173"

  # 3. Frontend UI (React 18 + Vite Static Site)
  - type: web
    name: nutrivision-ai-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://nutrivision-backend.onrender.com/api"
